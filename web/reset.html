<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3ecdf">
<title>CamCam — بروزرسانی صفحه</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3ecdf;color:#133936;font-family:Tahoma,Arial,sans-serif}.card{width:min(88vw,440px);padding:28px;border:1px solid #d9cfbe;border-radius:24px;background:#fffdf8;text-align:center;box-shadow:0 20px 60px rgba(42,72,67,.12)}.dot{width:42px;height:42px;border:4px solid #dcece8;border-top-color:#0c6e67;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 8px}p{color:#71817c;line-height:1.9;margin:0}
</style>
</head>
<body>
<div class="card"><div class="dot"></div><h1>در حال بروزرسانی CamCam…</h1><p>نسخه قدیمی کش‌شده پاک می‌شود و لندینگ جدید باز خواهد شد.</p></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.replace('/landing?fresh='+Date.now());
})();
</script>
</body>
</html>
