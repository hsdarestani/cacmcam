<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f0e6"><title>CamCam Pet — دوربین</title><style>
:root{--bg:#f6f0e6;--card:#fffaf2;--ink:#173c3a;--muted:#6b7e79;--brand:#0d6b66;--line:#d9d1c3;--bad:#a33e4c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:900;font-size:19px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 12px 40px rgba(28,67,62,.08)}button,input{font:inherit}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:11px 13px;font-weight:800}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--bad)}.video{position:relative;aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden}.video video{width:100%;height:100%;object-fit:cover}.badge{position:absolute;right:10px;top:10px;border-radius:99px;background:#fff4dd;padding:6px 9px;font-size:10px;font-weight:900}.badge.ok{color:#25704a;background:#edf8f1}.badge.err{color:#98424c;background:#fff0ef}.muted{color:var(--muted);font-size:12px;line-height:1.8}.field{margin:12px 0}.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;text-align:center;font-size:22px;letter-spacing:5px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.state{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:9px}.state b{display:block;margin-top:4px;font-size:11px}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.row .btn{flex:1;min-width:120px}.health{margin-top:10px;background:#edf4f0;border-radius:12px;padding:10px;font-size:11px;line-height:1.7}.low{display:none;position:fixed;inset:0;z-index:50;background:#000;color:#777;align-items:center;justify-content:center}.low.show{display:flex}.low button{background:#111;color:#888;border:1px solid #222;padding:18px;border-radius:16px}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:10px}}
</style></head><body><div class="wrap"><div class="head"><div class="brand">🐾 CamCam Pet<small>گوشی کنار پت</small></div><button class="btn" onclick="location.href='/'">داشبورد</button></div>
<section id="pair" class="card"><b>اتصال این گوشی</b><p class="muted">کد اتصال یک‌بارمصرف را از داشبورد وارد کن.</p><div class="field"><input id="code" inputmode="numeric" maxlength="8" placeholder="12345678"></div><div id="pairErr" class="muted"></div><button class="btn primary" style="width:100%" onclick="pairNow()">اتصال امن</button></section>
<section id="cam" class="hidden"><div class="card"><div class="video"><video id="preview" autoplay muted playsinline></video><span id="badge" class="badge">آماده‌سازی</span></div><p id="status" class="muted">در حال آماده‌سازی…</p><div class="grid"><div class="state">کیفیت<b id="qualityState">720p</b></div><div class="state">زوم<b id="zoomState">1.0×</b></div><div class="state">چراغ<b id="torchState">خاموش</b></div><div class="state">حرکت<b id="motionState">—</b></div><div class="state">صدا<b id="soundState">—</b></div><div class="state">صحبت<b id="talkState">آماده</b></div></div><div id="codec" class="health">در حال بررسی کدک و آرشیو…</div><div class="row"><button class="btn primary" onclick="startCamera(true,true)">راه‌اندازی مجدد</button><button class="btn" onclick="rotateLocal()">چرخش دوربین</button><button class="btn" onclick="setLowPower(!lowPower)">حالت کم‌مصرف</button><button class="btn danger" onclick="unpair()">قطع اتصال</button></div></div><div class="card"><b>وضعیت گوشی</b><p id="telemetry" class="muted">در حال خواندن…</p></div></section>
<canvas id="sendCanvas" class="hidden"></canvas><canvas id="motionCanvas" width="160" height="90" class="hidden"></canvas><canvas id="snapCanvas" width="320" height="180" class="hidden"></canvas><audio id="talkAudio" autoplay playsinline></audio></div><div id="low" class="low"><button onclick="setLowPower(false)">حالت کم‌مصرف فعال است<br><small>برای برگشت لمس کن</small></button></div><script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));let creds=null,pc=null,raw=null,out=null,talkPc=null,wake=null,starting=false,manualStop=false,facing='environment',lowPower=false,torch=false,zoom=1,digitalZoom=1,drawTimer=null,cmdTimer=null,hbTimer=null,motionTimer=null,soundTimer=null,telTimer=null,retryTimer=null,talkRetry=null,wakeLoop=false,audioCtx=null,analyser=null,lastFrame=null,motionHits=0,lastMotion=0,lastSound=0,soundHits=0,settings={quality:'720p',motion_sensitivity:'normal',sound_enabled:true,sound_threshold:24,pet_name:'',low_power_default:false};
function stored(){try{return JSON.parse(localStorage.getItem('camcam_device')||'null')}catch{return null}}function hdr(){return{'X-Device-ID':creds.id,'X-Device-Token':creds.token}}async function req(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt}),d={};try{d=await r.json()}catch{}if(!r.ok){let e=new Error(d.detail||'خطای ارتباط ('+r.status+')');e.status=r.status;throw e}return d}function newPeer(){return new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]})}function waitIce(p){return p.iceGatheringState==='complete'?Promise.resolve():new Promise(ok=>{let t=setTimeout(ok,3500);p.addEventListener('icegatheringstatechange',()=>{if(p.iceGatheringState==='complete'){clearTimeout(t);ok()}},{once:true})})}function badge(t,k=''){$('badge').textContent=t;$('badge').className='badge '+k}function dims(){return settings.quality==='1080p'?[1920,1080]:settings.quality==='360p'?[640,360]:[1280,720]}function states(){$('qualityState').textContent=settings.quality;$('zoomState').textContent=zoom.toFixed(1)+'×';$('torchState').textContent=torch?'روشن':'خاموش'}
function ui(){creds=stored();$('pair').classList.toggle('hidden',!!creds);$('cam').classList.toggle('hidden',!creds)}async function pairNow(){try{let code=$('code').value.replace(/\D/g,'');if(code.length<6)throw new Error('کد را کامل وارد کن');let d=await req('/api/pair',{method:'POST',body:JSON.stringify({code})});creds={id:d.device_id,name:d.name,token:d.device_token,whip:d.whip_url};localStorage.setItem('camcam_device',JSON.stringify(creds));ui();await loadSettings();await startCamera(true,false)}catch(e){$('pairErr').textContent=e.message}}async function loadSettings(){settings=await req('/api/pet/device/settings',{headers:hdr()});states()}
async function getMedia(force=false){if(raw&&!force&&raw.getVideoTracks()[0]?.readyState==='live')return;if(raw)raw.getTracks().forEach(t=>t.stop());const[w,h]=dims();raw=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:w},height:{ideal:h},frameRate:{ideal:20,max:24}},audio:false});try{let a=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});a.getAudioTracks().forEach(t=>raw.addTrack(t))}catch{}$('preview').srcObject=raw;await $('preview').play().catch(()=>{});prepareOutput();setupSound()}
function prepareOutput(){clearInterval(drawTimer);let v=$('preview'),c=$('sendCanvas'),[w,h]=dims();c.width=Math.min(w,v.videoWidth||w);c.height=Math.min(h,v.videoHeight||h);if(c.captureStream){let draw=()=>{if(!v.videoWidth)return;let z=Math.max(1,digitalZoom),sw=v.videoWidth/z,sh=v.videoHeight/z,sx=(v.videoWidth-sw)/2,sy=(v.videoHeight-sh)/2;c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height)};draw();let cs=c.captureStream(20);out=new MediaStream();cs.getVideoTracks().forEach(t=>out.addTrack(t));raw.getAudioTracks().forEach(t=>out.addTrack(t));drawTimer=setInterval(draw,50)}else out=raw}
function preferH264(p){try{let caps=RTCRtpSender.getCapabilities('video'),h=(caps?.codecs||[]).filter(c=>(c.mimeType||'').toLowerCase()==='video/h264'),o=(caps?.codecs||[]).filter(c=>(c.mimeType||'').toLowerCase()!=='video/h264'),tx=p.getTransceivers().find(x=>x.sender?.track?.kind==='video');if(h.length&&tx?.setCodecPreferences)tx.setCodecPreferences([...h,...o])}catch{}}
async function publish(){if(pc)pc.close();let p=newPeer();pc=p;(out||raw).getTracks().forEach(t=>p.addTrack(t,out||raw));preferH264(p);let offer=await p.createOffer();await p.setLocalDescription(offer);await waitIce(p);let r=await fetch(creds.whip,{method:'POST',headers:{'Content-Type':'application/sdp','Authorization':'Basic '+btoa(creds.id+':'+creds.token)},body:p.localDescription.sdp});if(!r.ok)throw new Error('استریم برقرار نشد ('+r.status+')');await p.setRemoteDescription({type:'answer',sdp:await r.text()});await new Promise((ok,no)=>{if(p.connectionState==='connected')return ok();let t=setTimeout(()=>no(new Error('اتصال تصویر کامل نشد')),12000);p.onconnectionstatechange=()=>{if(p.connectionState==='connected'){clearTimeout(t);ok()}else if(p.connectionState==='failed'){clearTimeout(t);no(new Error('اتصال تصویر شکست خورد'))}}});return p}
async function startCamera(force=false,reload=true){if(starting||!creds)return;starting=true;manualStop=false;clearTimeout(retryTimer);try{badge('در حال اتصال');if(reload)await loadSettings();await getMedia(force);await publish();badge('● زنده','ok');$('status').textContent='تصویر زنده در حال ارسال است.';startLoops();inspectCodec();try{window.CamCamNative?.setCameraActive(true)}catch{}}catch(e){badge('بازیابی','err');$('status').textContent=e.message;retryTimer=setTimeout(()=>startCamera(false,true),3000)}finally{starting=false}}
function startLoops(){clearInterval(hbTimer);hbTimer=setInterval(()=>req('/api/device/heartbeat',{method:'POST',headers:hdr()}).catch(()=>{}),15000);startCommands();startMotion();startTelemetry();startTalk();startTalkWake()}
function snap(){try{let c=$('snapCanvas'),src=$('sendCanvas').width?$('sendCanvas'):$('preview');c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.55)}catch{return null}}async function event(kind,confidence,metadata={},shot=true){try{return await req('/api/pet/device/event',{method:'POST',headers:hdr(),body:JSON.stringify({kind,confidence,metadata,snapshot_data_url:shot?snap():null})})}catch{}}async function ack(c,ok,message,extra={}){await event('control_ack',ok?100:0,{command_id:c.id,type:c.type,value:c.value,ok,message,...extra},false)}
function sensitivity(){return settings.motion_sensitivity==='high'?{r:.01,a:2}:settings.motion_sensitivity==='low'?{r:.055,a:5}:{r:.022,a:3}}function startMotion(){clearInterval(motionTimer);lastFrame=null;motionTimer=setInterval(()=>{if(!pc||pc.connectionState!=='connected'||!$('preview').videoWidth)return;let c=$('motionCanvas'),x=c.getContext('2d',{willReadFrequently:true});x.drawImage($('preview'),0,0,c.width,c.height);let d=x.getImageData(0,0,c.width,c.height).data,n=[],changed=0,delta=0,j=0;for(let i=0;i<d.length;i+=16){let l=(d[i]*.299+d[i+1]*.587+d[i+2]*.114)|0;n.push(l);if(lastFrame){let q=Math.abs(l-lastFrame[j]);delta+=q;if(q>24)changed++}j++}if(lastFrame){let r=changed/j,a=delta/j,t=sensitivity();$('motionState').textContent=(r*100).toFixed(1)+'٪';motionHits=r>t.r&&a>t.a?motionHits+1:Math.max(0,motionHits-1);if(motionHits>=2&&Date.now()-lastMotion>8000){motionHits=0;lastMotion=Date.now();event('motion',Math.min(100,Math.round(r*900+a*2)),{ratio:r,avg:a})}}lastFrame=n},800)}
function setupSound(){if(audioCtx){try{audioCtx.close()}catch{}}let t=raw?.getAudioTracks()[0];if(!t||!settings.sound_enabled){$('soundState').textContent='خاموش';return}try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=512;audioCtx.createMediaStreamSource(new MediaStream([t])).connect(analyser);clearInterval(soundTimer);let arr=new Uint8Array(analyser.fftSize);soundTimer=setInterval(()=>{analyser.getByteTimeDomainData(arr);let sum=0;for(let v of arr){let x=(v-128)/128;sum+=x*x}let rms=Math.sqrt(sum/arr.length);$('soundState').textContent=Math.round(rms*100)+'٪';soundHits=rms>settings.sound_threshold/200?soundHits+1:Math.max(0,soundHits-1);if(soundHits>=2&&Date.now()-lastSound>15000){soundHits=0;lastSound=Date.now();event('sound',Math.min(100,Math.round(rms*300)),{rms})}},500)}catch{$('soundState').textContent='ناموجود'}}
function startCommands(){clearInterval(cmdTimer);let poll=async()=>{try{for(let c of await req('/api/pet/device/commands',{headers:hdr()}))await applyCommand(c)}catch{}};poll();cmdTimer=setInterval(poll,1200)}async function applyCommand(c){try{if(c.type==='settings'){let old=settings.quality;settings={...settings,...c.value};states();setupSound();await ack(c,true,old!==settings.quality?'کیفیت '+settings.quality+' اعمال شد.':'تنظیمات اعمال شد.');if(old!==settings.quality)setTimeout(()=>startCamera(true,false),100);return}if(c.type==='quality'){settings.quality=String(c.value);states();await ack(c,true,'کیفیت '+settings.quality+' اعمال شد.');setTimeout(()=>startCamera(true,false),100);return}if(c.type==='camera'){facing=facing==='environment'?'user':'environment';await ack(c,true,'چرخش دوربین انجام شد.',{facing});setTimeout(()=>startCamera(true,false),100);return}if(c.type==='torch'){let r=await setTorch(Boolean(c.value));await ack(c,r.ok,r.message);return}if(c.type==='zoom'){let r=await setZoom(Number(c.value));await ack(c,r.ok,r.message,{applied_zoom:r.zoom});return}if(c.type==='low_power'){await setLowPower(Boolean(c.value));await ack(c,true,lowPower?'حالت کم‌مصرف فعال شد؛ روشنایی صفحه کاهش یافت.':'حالت کم‌مصرف خاموش شد.');return}if(c.type==='say'){let ok=say(String(c.value||''));await ack(c,ok,ok?'صدا از گوشی کنار پت پخش شد.':'پخش صوت روی این گوشی در دسترس نیست.');return}}catch(e){await ack(c,false,'دستور اجرا نشد: '+e.message)}}
async function setTorch(on){let t=raw?.getVideoTracks()[0];try{let cap=t?.getCapabilities?.();if(!cap?.torch)return{ok:false,message:'چراغ این دوربین از داخل اپ قابل کنترل نیست.'};await t.applyConstraints({advanced:[{torch:on}]});torch=on;states();return{ok:true,message:on?'چراغ روشن شد.':'چراغ خاموش شد.'}}catch{return{ok:false,message:'تغییر چراغ انجام نشد.'}}}async function setZoom(v){v=Math.max(1,Math.min(8,v||1));let t=raw?.getVideoTracks()[0];try{let cap=t?.getCapabilities?.();if(cap?.zoom){let z=Math.max(cap.zoom.min,Math.min(cap.zoom.max,v));await t.applyConstraints({advanced:[{zoom:z}]});zoom=Number(z);digitalZoom=1}else if($('sendCanvas').captureStream){zoom=v;digitalZoom=v}else return{ok:false,message:'زوم روی این گوشی پشتیبانی نمی‌شود.',zoom};states();return{ok:true,message:'زوم روی '+zoom.toFixed(1)+'× اعمال شد.',zoom}}catch{return{ok:false,message:'زوم اعمال نشد.',zoom}}}function say(text){if(!text)return false;try{if(window.CamCamNative?.speak&&window.CamCamNative.speak(text))return true}catch{}try{if(!speechSynthesis)return false;let u=new SpeechSynthesisUtterance(text);u.lang='fa-IR';speechSynthesis.cancel();speechSynthesis.speak(u);return true}catch{return false}}
async function startTalk(){if(talkPc&&['new','connecting','connected'].includes(talkPc.connectionState))return;try{if(talkPc)talkPc.close();let p=newPeer();talkPc=p;p.addTransceiver('audio',{direction:'recvonly'});let m=new MediaStream();p.ontrack=e=>{m.addTrack(e.track);$('talkAudio').srcObject=m;$('talkAudio').play().catch(()=>{});$('talkState').textContent='در حال پخش'};let o=await p.createOffer();await p.setLocalDescription(o);await waitIce(p);let r=await fetch(`/webrtc/talk/${creds.id}/whep`,{method:'POST',headers:{'Content-Type':'application/sdp','Authorization':'Basic '+btoa(creds.id+':'+creds.token)},body:p.localDescription.sdp});if(!r.ok)throw 0;await p.setRemoteDescription({type:'answer',sdp:await r.text()});p.onconnectionstatechange=()=>{if(p.connectionState==='connected')$('talkState').textContent='متصل';if(['failed','closed','disconnected'].includes(p.connectionState)){talkPc=null;$('talkState').textContent='آماده';talkRetry=setTimeout(startTalk,1400)}}}catch{talkPc=null;$('talkState').textContent='آماده';clearTimeout(talkRetry);talkRetry=setTimeout(startTalk,1800)}}async function startTalkWake(){if(wakeLoop)return;wakeLoop=true;while(creds&&!manualStop){try{let d=await req('/api/pet/device/talk-wait',{headers:hdr()});if(d.wake){if(talkPc)try{talkPc.close()}catch{}talkPc=null;await startTalk()}}catch{}await sleep(200)}wakeLoop=false}
async function telemetry(){try{let info={};if(window.CamCamNative?.getBatteryInfo)info=JSON.parse(window.CamCamNative.getBatteryInfo());let p={...info,low_power:lowPower,codec:window.codec||null,facing,quality:settings.quality,talk_connected:talkPc?.connectionState==='connected'};await req('/api/pet/device/telemetry',{method:'POST',headers:hdr(),body:JSON.stringify(p)});let a=[];if(info.battery!=null)a.push('باتری '+info.battery+'٪');if(info.charging!=null)a.push(info.charging?'در حال شارژ':'بدون شارژر');a.push('کیفیت '+settings.quality);a.push('زوم '+zoom.toFixed(1)+'×');$('telemetry').textContent=a.join(' · ')}catch{}}function startTelemetry(){clearInterval(telTimer);telemetry();telTimer=setInterval(telemetry,15000)}async function inspectCodec(){await sleep(1000);try{let st=await pc.getStats(),codec='';st.forEach(x=>{if(x.type==='outbound-rtp'&&x.kind==='video'&&x.codecId){let c=st.get(x.codecId);codec=c?.mimeType||codec}});window.codec=codec;$('codec').textContent=codec?'کدک زنده: '+codec+' · کلیپ‌های آرشیو هنگام پخش به H.264/AAC سازگار تبدیل می‌شوند.':'ضبط آرشیو فعال است.'}catch{}}
async function setLowPower(on){lowPower=on;$('low').classList.toggle('show',on);try{window.CamCamNative?.setLowPower(on)}catch{}await telemetry()}async function rotateLocal(){facing=facing==='environment'?'user':'environment';await startCamera(true,false)}async function unpair(){if(!confirm('اتصال این گوشی پاک شود؟'))return;manualStop=true;localStorage.removeItem('camcam_device');location.reload()}window.addEventListener('online',()=>creds&&startCamera(false,true));ui();creds=stored();if(creds)loadSettings().then(()=>startCamera(false,false));
</script></body></html>
