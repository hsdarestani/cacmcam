<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>CamCam Pet</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f1e8;color:#153c39;font-family:Tahoma,Arial,sans-serif}.box{text-align:center;padding:28px}.spin{width:38px;height:38px;border:4px solid #dcece8;border-top-color:#08776e;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#71827d}</style>
</head>
<body>
<div class="box"><div class="spin"></div><b>در حال باز کردن CamCam Pet…</b><p>نسخه جدید لندینگ بارگذاری می‌شود.</p></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(_){ }
  location.replace('/landing?legacy='+Date.now());
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/landing"></noscript>
</body>
</html>
