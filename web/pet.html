<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d6b66"><meta name="description" content="CamCam Pet — مراقبت از حیوان خانگی با گوشی اضافه"><title>CamCam Pet</title>
<style>
:root{--bg:#f6f0e6;--card:#fffaf2;--white:#fffdf8;--ink:#173c3a;--muted:#6b7e79;--green:#0d6b66;--green2:#159189;--soft:#dcece8;--line:#d9d1c3;--amber:#d7a73f;--red:#a33e4c;--shadow:0 14px 45px rgba(30,67,63,.10)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 90% 0,rgba(13,107,102,.12),transparent 26%),radial-gradient(circle at 5% 20%,rgba(215,167,63,.12),transparent 28%),var(--bg);color:var(--ink);min-height:100vh}button,input,select{font:inherit}.hidden{display:none!important}.shell{width:min(1120px,100%);margin:auto;padding:0 16px}.nav{height:74px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:900}.brand small{font-size:10px;color:var(--muted);display:block;margin-top:3px}.nav-actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:rgba(255,253,248,.9);color:var(--ink);padding:10px 13px;border-radius:13px;font-weight:800;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.dark{background:#102b2a;color:white;border-color:#102b2a}.btn.danger{color:var(--red)}.btn.small{padding:7px 9px;font-size:11px;border-radius:10px}.btn:disabled{opacity:.45;cursor:not-allowed}.auth{min-height:calc(100vh - 74px);display:grid;place-items:center}.auth-card{width:min(430px,100%);background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:25px;padding:24px;box-shadow:var(--shadow)}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#ece4d8;border-radius:12px;padding:4px;margin-bottom:18px}.auth-tabs button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:800;color:var(--muted)}.auth-tabs button.active{background:white;color:var(--green)}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;color:var(--muted)}.field input,.field select{width:100%;border:1px solid var(--line);background:white;padding:12px;border-radius:12px;color:var(--ink)}.error{color:var(--red);font-size:12px;min-height:18px}.app{padding-bottom:100px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 14px}.topline h2,.topline h3{margin:0}.muted{color:var(--muted);font-size:12px;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}.stat{background:rgba(255,253,248,.88);border:1px solid var(--line);border-radius:17px;padding:13px}.stat small{font-size:10px;color:var(--muted)}.stat b{display:block;font-size:20px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.camera{background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:21px;overflow:hidden;box-shadow:0 8px 24px rgba(31,68,63,.06)}.cover{height:132px;background:linear-gradient(145deg,#b8cfc7,#5e8c83 60%,#285751);position:relative;display:grid;place-items:center;color:white}.cover:after{content:'';position:absolute;inset:0;opacity:.18;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:33.333% 33.333%}.pet-icon{font-size:42px;z-index:1}.status{position:absolute;top:10px;right:10px;z-index:2;padding:5px 8px;border-radius:99px;background:#fff0ef;color:#98424c;font-size:10px;font-weight:900}.status.online{background:#edf8f1;color:#25704a}.battery{position:absolute;left:10px;top:10px;z-index:2;background:rgba(16,43,42,.72);color:#fff;padding:5px 8px;border-radius:99px;font-size:10px}.cam-body{padding:13px}.cam-body h3{margin:0 0 3px;font-size:16px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.chip{padding:5px 7px;border-radius:9px;background:#edf4f0;color:#45645f;font-size:10px}.actions{display:flex;gap:6px;flex-wrap:wrap}.panel{background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:13px;box-shadow:var(--shadow)}.video-shell{position:relative;aspect-ratio:16/9;background:#102b2a;border-radius:17px;overflow:hidden}.video-shell video{width:100%;height:100%;object-fit:contain;background:#000}.live{position:absolute;top:9px;right:9px;background:#fff3ec;color:#ad573d;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:900}.fullscreen{position:absolute;left:9px;bottom:9px;z-index:3}.carebar{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:7px;margin-top:9px}.talk{background:var(--green);border:0;color:white;border-radius:15px;font-weight:900;padding:13px;touch-action:none}.talk.active{background:#a33e4c;transform:scale(.98)}.control{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px;font-weight:800;font-size:11px}.preset{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.health{padding:10px 11px;border-radius:13px;background:#edf4f0;color:#45645f;font-size:11px;line-height:1.8;margin-top:9px}.health.warn{background:#fff3dd;color:#775817}.health.err{background:#fff0ef;color:#92434b}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.section{border:1px solid #e2d9cc;background:#fffaf2;border-radius:17px;padding:12px}.section h3{font-size:15px;margin:0 0 9px}.timeline{display:grid;gap:7px}.event{display:grid;grid-template-columns:72px 1fr auto;gap:9px;align-items:center;border:1px solid #e4dbcf;background:#fff;border-radius:13px;padding:8px}.event img{width:72px;height:52px;object-fit:cover;border-radius:9px;background:#eee}.event .empty-img{width:72px;height:52px;border-radius:9px;background:#edf4f0;display:grid;place-items:center;font-size:22px}.event b{font-size:12px}.event small{font-size:9px;color:var(--muted);display:block;margin-top:3px}.record{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #e4dbcf;background:#fff;border-radius:12px;padding:9px;font-size:11px}.modal-back{position:fixed;inset:0;background:rgba(13,35,33,.55);z-index:100;display:grid;place-items:center;padding:14px}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--white);border:1px solid var(--line);border-radius:22px;padding:18px}.modal h3{margin-top:0}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.share-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px;margin-top:6px;font-size:11px}.toast{position:fixed;left:15px;bottom:20px;z-index:200;background:#102b2a;color:#fff;padding:11px 13px;border-radius:12px;font-size:11px;max-width:calc(100vw - 30px)}.empty{text-align:center;color:var(--muted);font-size:12px;padding:22px;border:1px dashed var(--line);border-radius:13px}.bottom{display:none}@media(max-width:780px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.columns{grid-template-columns:1fr}.carebar{grid-template-columns:1fr 1fr}.talk{grid-column:1/-1}.nav{height:64px}.app{padding-bottom:92px}.bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;z-index:50;bottom:max(8px,env(safe-area-inset-bottom));left:10px;right:10px;background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 14px 40px rgba(25,60,55,.18);backdrop-filter:blur(16px)}.bottom button{border:0;background:transparent;padding:8px 3px;color:var(--muted);font-size:10px}.bottom button b{display:block;font-size:15px}.settings-grid{grid-template-columns:1fr}.event{grid-template-columns:62px 1fr auto}.event img,.event .empty-img{width:62px;height:48px}}
</style></head><body><div class="shell"><nav class="nav"><div class="brand">🐾 CamCam Pet<small>همیشه حواست بهش هست</small></div><div class="nav-actions"><button id="cameraBtn" class="btn" onclick="location.href='/camera'">گوشی دوربین</button><button id="logoutBtn" class="btn hidden" onclick="logout()">خروج</button></div></nav></div>
<section id="auth" class="auth shell hidden"><div class="auth-card"><div class="auth-tabs"><button id="loginTab" class="active" onclick="setAuth('login')">ورود</button><button id="registerTab" onclick="setAuth('register')">ثبت‌نام</button></div><h2 id="authTitle">خوش برگشتی</h2><p class="muted" id="authDesc">برای دیدن پت وارد حسابت شو.</p><form onsubmit="submitAuth(event)"><div class="field"><label>ایمیل</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>رمز عبور</label><input id="password" type="password" minlength="10" required></div><div id="authErr" class="error"></div><button class="btn primary" style="width:100%">ادامه</button></form></div></section>
<main id="app" class="app shell hidden"><div class="topline"><div><h2>پت‌های من</h2><div id="account" class="muted"></div></div><button class="btn primary" onclick="addCamera()">＋ افزودن دوربین</button></div><div class="stats"><div class="stat"><small>دوربین‌ها</small><b id="camCount">۰</b></div><div class="stat"><small>آنلاین</small><b id="onlineCount">۰</b></div><div class="stat"><small>هشدار امروز</small><b id="alertCount">۰</b></div><div class="stat"><small>پت فعال</small><b id="petCount">۰</b></div></div><div id="cameraGrid" class="grid"></div>
<section id="detail" class="panel hidden"><div class="topline"><div><h3 id="detailTitle">نمای زنده</h3><div id="detailAccess" class="muted"></div></div><button class="btn small" onclick="closeDetail()">بستن</button></div><div class="video-shell" id="videoBox"><video id="liveVideo" autoplay playsinline></video><span id="liveState" class="live">در حال اتصال</span><button class="btn small fullscreen" onclick="fullscreenLive()">⛶ تمام‌صفحه</button></div><div class="carebar"><button id="talkBtn" class="talk" onpointerdown="startTalk(event)" onpointerup="stopTalk()" onpointercancel="stopTalk()" onpointerleave="stopTalk()">🎙 نگه دار و صحبت کن</button><button class="control" onclick="cmd('torch',true)">🔦 روشن</button><button class="control" onclick="cmd('torch',false)">چراغ خاموش</button><button class="control" onclick="cmd('camera','switch')">🔄 دوربین</button><button class="control" onclick="toggleLowPower()">🌙 کم‌مصرف</button></div><div class="preset"><button class="btn small" onclick="say('بیا پیشم')">🔊 بیا پیشم</button><button class="btn small" onclick="say('نه عزیزم')">🔊 نه عزیزم</button><button class="btn small" onclick="say('غذات آماده‌ست')">🔊 غذات آماده‌ست</button><button class="btn small" onclick="zoom(1)">1×</button><button class="btn small" onclick="zoom(2)">2×</button><button class="btn small" onclick="zoom(3)">3×</button><select id="quality" class="btn small" onchange="cmd('quality',this.value)"><option>360p</option><option selected>720p</option><option>1080p</option></select><button id="settingsBtn" class="btn small" onclick="openSettings()">⚙ تنظیمات</button></div><div id="health" class="health">در حال بررسی ضبط، باتری و اتصال…</div><div class="columns"><div class="section"><h3>رویدادهای اخیر</h3><div id="events" class="timeline"><div class="muted">در حال دریافت…</div></div></div><div class="section"><h3>آرشیو ضبط</h3><div id="recordings" class="timeline"><div class="muted">در حال دریافت…</div></div></div></div></section></main>
<div class="bottom"><button onclick="scrollTo({top:0,behavior:'smooth'})"><b>⌂</b>خانه</button><button onclick="location.href='/camera'"><b>◉</b>دوربین</button><button onclick="activeId&&openSettings()"><b>⚙</b>تنظیمات</button><button onclick="logout()"><b>↪</b>خروج</button></div>
<div id="modalBack" class="modal-back hidden"><div id="modal" class="modal"></div></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));let me=null,devices=[],authMode='login',activeId=null,activeDevice=null,watchPC=null,watchRetry=null,talkPC=null,talkStream=null,talkResource=null,lowPowerRemote=false,detailPoll=null,lastEvents=[];
async function api(url,opt={}){let r;try{r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt})}catch{throw new Error('ارتباط با سرور برقرار نشد')}let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.detail||'خطای ارتباط ('+r.status+')');e.status=r.status;throw e}return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){if(!v)return'—';try{return new Date(v).toLocaleString('fa-IR')}catch{return v}}function icon(type){return type==='dog'?'🐶':type==='cat'?'🐱':'🐾'}function eventName(k,m={}){if(k==='motion')return'حرکت پت';if(k==='sound'){if(m.beta_hint==='bark_like')return'صدای غیرعادی · پارس احتمالی';if(m.beta_hint==='meow_like')return'صدای غیرعادی · میو احتمالی';return'صدای غیرعادی'}if(k==='inactivity')return'بی‌تحرکی طولانی';if(k==='battery_low')return'باتری دوربین کم است';if(k==='unplugged')return'شارژر دوربین قطع شد';if(k==='temperature_high')return'گوشی دوربین داغ شده';return k}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').classList.add('hidden'),4200)}
function setAuth(mode){authMode=mode;$('loginTab').classList.toggle('active',mode==='login');$('registerTab').classList.toggle('active',mode==='register');$('authTitle').textContent=mode==='login'?'خوش برگشتی':'حساب CamCam Pet';$('authDesc').textContent=mode==='login'?'برای دیدن پت وارد حسابت شو.':'۷ روز رایگان شروع کن و گوشی اضافه را دوربین پت کن.';$('authErr').textContent=''}
async function submitAuth(e){e.preventDefault();$('authErr').textContent='';try{await api('/api/auth/'+authMode,{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});await boot()}catch(x){$('authErr').textContent=x.message}}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}closeDetail();me=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('logoutBtn').classList.add('hidden')}
async function boot(){try{me=await api('/api/me');$('account').textContent=me.email;$('logoutBtn').classList.remove('hidden');$('auth').classList.add('hidden');$('app').classList.remove('hidden');await loadDevices()}catch(e){$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('logoutBtn').classList.add('hidden')}}
async function loadDevices(){devices=await api('/api/pet/devices');$('camCount').textContent=devices.length.toLocaleString('fa-IR');$('onlineCount').textContent=devices.filter(x=>x.online).length.toLocaleString('fa-IR');$('petCount').textContent=devices.filter(x=>x.pet?.pet_name).length.toLocaleString('fa-IR');renderDevices();let alerts=0;for(const d of devices){if(d.last_event&&Date.now()-new Date(d.last_event.created_at)<86400000&&['inactivity','battery_low','unplugged','temperature_high'].includes(d.last_event.kind))alerts++}$('alertCount').textContent=alerts.toLocaleString('fa-IR')}
function renderDevices(){const g=$('cameraGrid');if(!devices.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">هنوز دوربینی نداری.<br><br><button class="btn primary" onclick="addCamera()">اولین دوربین پت را بساز</button></div>';return}g.innerHTML=devices.map(d=>{const p=d.pet||{},t=d.telemetry||{},b=t.battery!=null?`<span class="battery">🔋 ${t.battery}%${t.charging?' ⚡':''}</span>`:'';return`<article class="camera"><div class="cover"><span class="pet-icon">${icon(p.pet_type)}</span><span class="status ${d.online?'online':''}">${d.online?'● آنلاین':'● آفلاین'}</span>${b}</div><div class="cam-body"><h3>${esc(p.pet_name||d.name)}</h3><div class="muted">${p.pet_name?esc(d.name)+' · ':''}${d.last_seen_at?'آخرین ارتباط '+fmt(d.last_seen_at):'هنوز متصل نشده'}</div><div class="chips"><span class="chip">حساسیت ${p.motion_sensitivity==='high'?'زیاد':p.motion_sensitivity==='low'?'کم':'معمولی'}</span><span class="chip">بی‌تحرکی ${p.inactivity_minutes||120} دقیقه</span>${d.access!=='owner'?`<span class="chip">دسترسی ${d.access==='caregiver'?'مراقب':'مشاهده'}</span>`:''}</div><div class="actions"><button class="btn small primary" onclick="watch('${d.id}')">دیدن پت</button><button class="btn small" onclick="openSettings('${d.id}')">تنظیمات</button>${d.access==='owner'?`<button class="btn small" onclick="pairCode('${d.id}')">کد اتصال</button>`:''}</div></div></article>`}).join('')}
async function addCamera(){const name=prompt('اسم دوربین را وارد کن:','دوربین پت');if(!name)return;try{const d=await api('/api/devices',{method:'POST',body:JSON.stringify({name})});showPair(d.pairing_code);await loadDevices()}catch(e){toast(e.message)}}async function pairCode(id){try{const d=await api(`/api/devices/${id}/pair-code`,{method:'POST'});showPair(d.pairing_code)}catch(e){toast(e.message)}}function showPair(code){$('modal').innerHTML=`<h3>اتصال گوشی دوربین</h3><p class="muted">روی گوشی کنار پت، حالت دوربین را باز کن و این کد را وارد کن.</p><div style="font:900 34px monospace;text-align:center;letter-spacing:6px;padding:17px;background:#edf4f0;border-radius:14px;direction:ltr">${esc(code)}</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="location.href='/camera'">باز کردن دوربین روی همین گوشی</button>`;$('modalBack').classList.remove('hidden')}
function waitIce(p){return p.iceGatheringState==='complete'?Promise.resolve():new Promise(ok=>{let done=false;const finish=()=>{if(done)return;done=true;p.removeEventListener('icegatheringstatechange',f);ok()};const f=()=>p.iceGatheringState==='complete'&&finish();p.addEventListener('icegatheringstatechange',f);setTimeout(finish,4200)})}function newPeer(){return new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}],iceCandidatePoolSize:1})}
async function connectViewer(a){const p=newPeer();p.addTransceiver('video',{direction:'recvonly'});p.addTransceiver('audio',{direction:'recvonly'});const media=new MediaStream();p.ontrack=e=>{media.addTrack(e.track);$('liveVideo').srcObject=media;$('liveVideo').play().catch(()=>{})};const offer=await p.createOffer();await p.setLocalDescription(offer);await waitIce(p);const r=await fetch(a.whep_url,{method:'POST',headers:{'Content-Type':'application/sdp','Authorization':'Bearer '+a.token},body:p.localDescription.sdp});if(!r.ok){p.close();const e=new Error(r.status===404?'دوربین هنوز استریم ندارد.':'اتصال زنده پاسخ نداد ('+r.status+')');e.status=r.status;throw e}await p.setRemoteDescription({type:'answer',sdp:await r.text()});return p}
async function watch(id){closeDetail(false);activeId=id;activeDevice=devices.find(x=>x.id===id)||null;$('detail').classList.remove('hidden');$('detailTitle').textContent=(activeDevice?.pet?.pet_name||activeDevice?.name||'پت')+' · زنده';$('detailAccess').textContent=activeDevice?.access==='owner'?'مالک دوربین':activeDevice?.access==='caregiver'?'دسترسی مراقب':'فقط مشاهده';const canCare=activeDevice?.access!=='viewer';$('talkBtn').disabled=!canCare;document.querySelectorAll('.carebar .control,.preset .btn,.preset select').forEach(x=>x.disabled=!canCare);$('settingsBtn').disabled=false;$('quality').value=activeDevice?.pet?.quality||'720p';$('liveState').textContent='در حال اتصال';$('detail').scrollIntoView({behavior:'smooth',block:'start'});loadDetailData();try{const a=await api(`/api/pet/devices/${id}/watch-token`,{method:'POST'});let err=null;for(let i=0;i<4;i++){try{watchPC=await connectViewer(a);err=null;break}catch(e){err=e;if(i<3&&[0,404,409,503].includes(e.status))await sleep(800+i*600);else break}}if(err)throw err;$('liveState').textContent='● زنده';watchPC.onconnectionstatechange=()=>{if(watchPC?.connectionState==='connected')$('liveState').textContent='● زنده';else if(['failed','disconnected'].includes(watchPC?.connectionState)){ $('liveState').textContent='بازیابی';clearTimeout(watchRetry);watchRetry=setTimeout(()=>activeId&&watch(activeId),2200)}}}catch(e){$('liveState').textContent='تصویر آماده نیست';toast(e.message)}clearInterval(detailPoll);detailPoll=setInterval(loadDetailData,15000)}
function closeDetail(hide=true){clearTimeout(watchRetry);clearInterval(detailPoll);stopTalk();if(watchPC){watchPC.close();watchPC=null}const v=$('liveVideo');if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}if(hide){$('detail').classList.add('hidden');activeId=null;activeDevice=null}}
async function loadDetailData(){if(!activeId)return;await Promise.allSettled([loadEvents(),loadRecordings(),loadHealth()])}
async function loadEvents(){try{lastEvents=await api(`/api/pet/devices/${activeId}/events`);$('events').innerHTML=lastEvents.length?lastEvents.slice(0,30).map(e=>{const m=e.metadata||{},img=e.snapshot_url?`<img src="${esc(e.snapshot_url)}" loading="lazy">`:`<div class="empty-img">${e.kind==='motion'?'◉':e.kind==='sound'?'♫':'!'}</div>`;return`<div class="event">${img}<div><b>${esc(eventName(e.kind,m))}</b><small>${fmt(e.created_at)}${e.confidence!=null?' · '+e.confidence+'٪':''}${m.quiet?' · ساعات سکوت':''}</small></div><a class="btn small" href="${esc(e.highlight_url)}">کلیپ</a></div>`}).join(''):'<div class="empty">هنوز رویدادی ثبت نشده.</div>'}catch(e){$('events').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function loadRecordings(){try{const a=await api(`/api/pet/devices/${activeId}/recordings`);$('recordings').innerHTML=a.length?a.slice(0,30).map(r=>`<div class="record"><div><b>ویدئو</b><div class="muted">${fmt(r.created_at)}${r.duration?' · '+Math.round(r.duration)+' ثانیه':''}</div></div><a class="btn small" href="${esc(r.url)}">پخش</a></div>`).join(''):'<div class="empty">هنوز آرشیوی آماده نشده.</div>'}catch(e){$('recordings').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function loadHealth(){try{const h=await api(`/api/pet/devices/${activeId}/health`),t=h.telemetry||{};let parts=[h.online?'دوربین آنلاین است':'دوربین آفلاین است',h.recording?'ضبط آرشیو سالم است':'آرشیو جدید دیده نمی‌شود'];if(t.battery!=null)parts.push('باتری '+t.battery+'٪'+(t.charging?' و در حال شارژ':''));if(t.temperature_c!=null)parts.push('دما '+Number(t.temperature_c).toFixed(1)+'°C');if(t.codec)parts.push('کدک '+t.codec);$('health').textContent=parts.join(' · ');$('health').className='health '+(!h.online?'err':!h.recording?'warn':'')}catch(e){$('health').textContent=e.message;$('health').className='health warn'}}
async function startTalk(e){e?.preventDefault();if(!activeId||talkPC||activeDevice?.access==='viewer')return;const btn=$('talkBtn');try{btn.classList.add('active');btn.textContent='🎙 در حال صحبت…';$('liveVideo').muted=true;talkStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1},video:false});const a=await api(`/api/pet/devices/${activeId}/talk-token`,{method:'POST'});const p=newPeer();talkPC=p;talkStream.getAudioTracks().forEach(t=>p.addTrack(t,talkStream));const offer=await p.createOffer();await p.setLocalDescription(offer);await waitIce(p);const r=await fetch(a.whip_url,{method:'POST',headers:{'Content-Type':'application/sdp','Authorization':'Bearer '+a.token},body:p.localDescription.sdp});if(!r.ok)throw new Error(r.status===409?'یک نفر دیگر در حال صحبت است.':'صدا به دوربین وصل نشد ('+r.status+')');talkResource=r.headers.get('Location');await p.setRemoteDescription({type:'answer',sdp:await r.text()})}catch(x){toast(x.message);stopTalk()}}
async function stopTalk(){const btn=$('talkBtn');if(btn){btn.classList.remove('active');btn.textContent='🎙 نگه دار و صحبت کن'}$('liveVideo').muted=false;if(talkStream){talkStream.getTracks().forEach(t=>t.stop());talkStream=null}if(talkPC){try{talkPC.close()}catch{}talkPC=null}if(talkResource){try{await fetch(talkResource,{method:'DELETE'})}catch{}talkResource=null}}
async function cmd(type,value){if(!activeId||activeDevice?.access==='viewer')return;try{await api(`/api/pet/devices/${activeId}/command`,{method:'POST',body:JSON.stringify({type,value})});toast('فرمان ارسال شد')}catch(e){toast(e.message)}}function say(s){cmd('say',s)}function zoom(v){cmd('zoom',v)}function toggleLowPower(){lowPowerRemote=!lowPowerRemote;cmd('low_power',lowPowerRemote)}
async function fullscreenLive(){const v=$('liveVideo');try{if(v.requestFullscreen)await v.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}catch{toast('تمام‌صفحه روی این دستگاه در دسترس نیست')}}
async function openSettings(id=null){id=id||activeId;if(!id)return;const d=devices.find(x=>x.id===id);if(!d)return;let s;try{s=await api(`/api/pet/devices/${id}/settings`)}catch(e){toast(e.message);return}const owner=d.access==='owner',care=d.access!=='viewer';$('modal').innerHTML=`<h3>تنظیمات ${esc(s.pet_name||d.name)}</h3><div class="settings-grid"><div class="field"><label>اسم پت</label><input id="sPet" value="${esc(s.pet_name)}" ${care?'':'disabled'}></div><div class="field"><label>نوع</label><select id="sType" ${care?'':'disabled'}><option value="dog" ${s.pet_type==='dog'?'selected':''}>سگ</option><option value="cat" ${s.pet_type==='cat'?'selected':''}>گربه</option><option value="other" ${s.pet_type==='other'?'selected':''}>سایر</option></select></div><div class="field"><label>حساسیت حرکت</label><select id="sMotion" ${care?'':'disabled'}><option value="high" ${s.motion_sensitivity==='high'?'selected':''}>زیاد</option><option value="normal" ${s.motion_sensitivity==='normal'?'selected':''}>معمولی</option><option value="low" ${s.motion_sensitivity==='low'?'selected':''}>کم</option></select></div><div class="field"><label>حساسیت صدا (۸ تا ۸۰)</label><input id="sSound" type="number" min="8" max="80" value="${s.sound_threshold}" ${care?'':'disabled'}></div><div class="field"><label>هشدار بی‌تحرکی (دقیقه)</label><input id="sIdle" type="number" min="15" max="1440" value="${s.inactivity_minutes}" ${care?'':'disabled'}></div><div class="field"><label>کیفیت</label><select id="sQuality" ${care?'':'disabled'}><option ${s.quality==='360p'?'selected':''}>360p</option><option ${s.quality==='720p'?'selected':''}>720p</option><option ${s.quality==='1080p'?'selected':''}>1080p</option></select></div><div class="field"><label>شروع ساعات سکوت</label><input id="sQuietStart" type="time" value="${esc(s.quiet_start||'')}" ${care?'':'disabled'}></div><div class="field"><label>پایان ساعات سکوت</label><input id="sQuietEnd" type="time" value="${esc(s.quiet_end||'')}" ${care?'':'disabled'}></div></div><label style="display:flex;gap:7px;align-items:center;font-size:12px"><input id="sSoundOn" type="checkbox" ${s.sound_enabled?'checked':''} ${care?'':'disabled'}> تشخیص صدای غیرعادی فعال باشد</label><label style="display:flex;gap:7px;align-items:center;font-size:12px;margin-top:7px"><input id="sLow" type="checkbox" ${s.low_power_default?'checked':''} ${care?'':'disabled'}> دوربین بعد از شروع وارد حالت کم‌مصرف شود</label>${care?`<button class="btn primary" style="width:100%;margin-top:12px" onclick="saveSettings('${id}')">ذخیره تنظیمات</button>`:''}${owner?`<hr style="border:0;border-top:1px solid #ddd;margin:18px 0"><h3>اعضای خانواده</h3><div class="field"><label>ایمیل عضو</label><input id="shareEmail" type="email" placeholder="family@example.com"></div><div class="field"><label>سطح دسترسی</label><select id="shareRole"><option value="caregiver">مراقب · مشاهده و صحبت/کنترل</option><option value="viewer">فقط مشاهده</option></select></div><button class="btn" style="width:100%" onclick="addShare('${id}')">افزودن عضو</button><div id="shareList" style="margin-top:8px"></div>`:''}`;$('modalBack').classList.remove('hidden');if(owner)loadShares(id)}
async function saveSettings(id){try{const body={pet_name:$('sPet').value,pet_type:$('sType').value,motion_sensitivity:$('sMotion').value,sound_enabled:$('sSoundOn').checked,sound_threshold:Number($('sSound').value),inactivity_minutes:Number($('sIdle').value),quiet_start:$('sQuietStart').value||null,quiet_end:$('sQuietEnd').value||null,low_power_default:$('sLow').checked,quality:$('sQuality').value};await api(`/api/pet/devices/${id}/settings`,{method:'PUT',body:JSON.stringify(body)});closeModal();await loadDevices();if(activeId===id){activeDevice=devices.find(x=>x.id===id);$('quality').value=body.quality}toast('تنظیمات ذخیره شد')}catch(e){toast(e.message)}}
async function loadShares(id){try{const a=await api(`/api/pet/devices/${id}/shares`);$('shareList').innerHTML=a.length?a.map(x=>`<div class="share-row"><span>${esc(x.email)} · ${x.role==='caregiver'?'مراقب':'مشاهده'}</span><button class="btn small danger" onclick="removeShare('${id}','${x.id}')">حذف</button></div>`).join(''):'<div class="muted">هنوز کسی اضافه نشده.</div>'}catch(e){$('shareList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function addShare(id){try{await api(`/api/pet/devices/${id}/shares`,{method:'POST',body:JSON.stringify({email:$('shareEmail').value,role:$('shareRole').value})});$('shareEmail').value='';await loadShares(id)}catch(e){toast(e.message)}}async function removeShare(id,sid){if(!confirm('دسترسی این عضو حذف شود؟'))return;try{await api(`/api/pet/devices/${id}/shares/${sid}`,{method:'DELETE'});await loadShares(id)}catch(e){toast(e.message)}}
function closeModal(){$('modalBack').classList.add('hidden')}$('modalBack').addEventListener('click',e=>{if(e.target===$('modalBack'))closeModal()});if('serviceWorker'in navigator)navigator.serviceWorker.register('/static/sw.js').catch(()=>{});boot();
</script></body></html>
