logLevel: info
api: false
metrics: false
pprof: false
rtsp: false
rtmp: false
hls: false
srt: false
moq: false

# Playback is private inside Docker; authenticated gateways proxy MP4 to users.
playback: true
playbackAddress: :9996
playbackEncryption: false
playbackAllowOrigins:
  - https://camcam.smarbiz.sbs

authMethod: http
authHTTPAddress: http://pet:8020/internal/mediamtx/auth
authHTTPExclude: []

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins:
  - https://camcam.smarbiz.sbs
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts:
  - camcam.smarbiz.sbs
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

paths:
  "~^cam/.+$":
    source: publisher
    record: true
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordPartDuration: 1s
    # One-minute segments make new archive entries visible quickly while keeping
    # continuous recording, so event highlights can include seconds before motion.
    recordSegmentDuration: 1m
    recordDeleteAfter: 31d

  "~^talk/.+$":
    source: publisher
    # Two-way pet talk is live-only and is deliberately never archived.
    record: false
