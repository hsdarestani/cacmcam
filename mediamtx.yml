logLevel: info
api: false
metrics: false
pprof: false
rtsp: false
rtmp: false
hls: false
srt: false
moq: false

# Playback stays on the private Docker network. Browsers never talk to this
# listener directly; backend/archive_proxy.py authenticates the CamCam user,
# obtains a short-lived watch token, then proxies standard MP4 output.
playback: true
playbackAddress: :9996
playbackEncryption: false
playbackAllowOrigins:
  - https://camcam.smarbiz.sbs

authMethod: http
authHTTPAddress: http://api:8000/internal/mediamtx/auth
authHTTPExclude: []

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins:
  - https://camcam.smarbiz.sbs
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts:
  - camcam.smarbiz.sbs
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

paths:
  all_others:
    source: publisher
    record: true
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 10m
    recordDeleteAfter: 31d
