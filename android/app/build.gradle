plugins {
    id 'com.android.application'
}

android {
    namespace 'com.camcam.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.camcam'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}
