plugins {
    id 'com.android.application'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.camcam.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.camcam'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '1.4.6'
    }

    def bazaarKeystorePath = System.getenv('BAZAAR_KEYSTORE_PATH')
    def bazaarKeystorePassword = System.getenv('BAZAAR_KEYSTORE_PASSWORD')
    def bazaarKeyAlias = System.getenv('BAZAAR_KEY_ALIAS')
    def bazaarKeyPassword = System.getenv('BAZAAR_KEY_PASSWORD')

    signingConfigs {
        bazaar {
            if (bazaarKeystorePath && bazaarKeystorePassword && bazaarKeyAlias && bazaarKeyPassword) {
                storeFile file(bazaarKeystorePath)
                storePassword bazaarKeystorePassword
                keyAlias bazaarKeyAlias
                keyPassword bazaarKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (bazaarKeystorePath && bazaarKeystorePassword && bazaarKeyAlias && bazaarKeyPassword) {
                signingConfig signingConfigs.bazaar
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    buildFeatures {
        aidl true
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
}
