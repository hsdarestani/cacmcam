name: camcam
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: camcam
      POSTGRES_USER: camcam
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camcam -d camcam"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://camcam:${DB_PASSWORD}@db:5432/camcam
      REDIS_URL: redis://redis:6379/0
      BASE_URL: https://camcam.smarbiz.sbs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - recordings:/recordings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
    ports:
      - "8189:8189/udp"
      - "8189:8189/tcp"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      mediamtx:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  recordings:
  caddy_data:
  caddy_config:
