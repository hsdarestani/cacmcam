name: Validate and Deploy CamCam

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: camcam-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python -m py_compile backend/app.py
      - name: Validate admin JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('web/admin.html').read_text()
          match = re.search(r'<script>(.*)</script>', html, re.S)
          if not match:
              raise SystemExit('admin script not found')
          Path('/tmp/admin.js').write_text(match.group(1))
          PY
          node --check /tmp/admin.js
      - name: Build and smoke-import application
        run: |
          docker build -t camcam-ci .
          docker run --rm camcam-ci python -c "import app; assert any(getattr(r, 'path', '') == '/admin' for r in app.app.routes); assert any(getattr(r, 'path', '') == '/api/admin/overview' for r in app.app.routes); print('CamCam import smoke test OK')"
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          rm .env
      - name: Guard brand isolation
        run: |
          LEGACY_LATIN="$(printf '%s%s' 'ha' 'moon')"
          if grep -Rini "$LEGACY_LATIN" --exclude-dir=.git .; then
            echo 'Forbidden legacy brand reference found'
            exit 1
          fi

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          ZIBAL_MERCHANT: ${{ secrets.ZIBAL_MERCHANT }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER || 'root' }}
          password: ${{ secrets.PASS }}
          port: ${{ secrets.PORT || 22 }}
          envs: ZIBAL_MERCHANT,ADMIN_EMAILS
          command_timeout: 20m
          script: |
            set -eu
            APP_DIR=/opt/camcam
            REPO=https://github.com/hsdarestani/cacmcam.git

            if ! command -v docker >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update
                apt-get install -y docker.io git curl openssl ca-certificates
                apt-get install -y docker-compose-v2 || apt-get install -y docker-compose-plugin || true
                systemctl enable --now docker || service docker start
              else
                echo 'Fresh server detected, but automatic bootstrap currently supports Debian/Ubuntu only'
                exit 1
              fi
            fi

            if ! command -v git >/dev/null 2>&1; then
              apt-get update && apt-get install -y git
            fi

            if ! docker compose version >/dev/null 2>&1; then
              apt-get update
              apt-get install -y docker-compose-v2 || apt-get install -y docker-compose-plugin
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone "$REPO" "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi
            cd "$APP_DIR"

            PUBLIC_IP=$(curl -4fsS --max-time 10 https://api.ipify.org || true)
            WEBRTC_HOST=${PUBLIC_IP:-camcam.smarbiz.sbs}

            if [ ! -f .env ]; then
              SECRET_KEY=$(openssl rand -hex 48)
              DB_PASSWORD=$(openssl rand -hex 24)
              cat > .env <<EOF
            APP_NAME=CamCam
            BASE_URL=https://camcam.smarbiz.sbs
            SECRET_KEY=$SECRET_KEY
            DB_PASSWORD=$DB_PASSWORD
            REDIS_URL=redis://redis:6379/0
            ZIBAL_MERCHANT=$ZIBAL_MERCHANT
            STARTER_MONTHLY_RIAL=2990000
            STARTER_YEARLY_RIAL=29900000
            PRO_MONTHLY_RIAL=5990000
            PRO_YEARLY_RIAL=59900000
            ADMIN_EMAILS=$ADMIN_EMAILS
            SECURE_COOKIES=true
            WEBRTC_ADDITIONAL_HOSTS=$WEBRTC_HOST
            EOF
            else
              if [ -n "${ZIBAL_MERCHANT:-}" ]; then
                if grep -q '^ZIBAL_MERCHANT=' .env; then sed -i "s|^ZIBAL_MERCHANT=.*|ZIBAL_MERCHANT=$ZIBAL_MERCHANT|" .env; else printf '\nZIBAL_MERCHANT=%s\n' "$ZIBAL_MERCHANT" >> .env; fi
              fi
              if [ -n "${ADMIN_EMAILS:-}" ]; then
                if grep -q '^ADMIN_EMAILS=' .env; then sed -i "s|^ADMIN_EMAILS=.*|ADMIN_EMAILS=$ADMIN_EMAILS|" .env; else printf '\nADMIN_EMAILS=%s\n' "$ADMIN_EMAILS" >> .env; fi
              fi
              if grep -q '^WEBRTC_ADDITIONAL_HOSTS=' .env; then sed -i "s|^WEBRTC_ADDITIONAL_HOSTS=.*|WEBRTC_ADDITIONAL_HOSTS=$WEBRTC_HOST|" .env; else printf '\nWEBRTC_ADDITIONAL_HOSTS=%s\n' "$WEBRTC_HOST" >> .env; fi
            fi

            chmod 600 .env
            docker compose pull db redis mediamtx caddy
            docker compose up -d --build --remove-orphans
            docker compose exec -T api curl -fsS http://127.0.0.1:8000/health
            echo
            docker compose ps
            echo "CAMCAM_SERVER_IPV4=$PUBLIC_IP"
            echo "CAMCAM_WEBRTC_HOST=$WEBRTC_HOST"
            docker image prune -f >/dev/null 2>&1 || true
