name: Validate and Deploy CamCam

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: camcam-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python -m py_compile backend/app.py backend/archive_proxy.py backend/pet_app.py backend/pet_archive.py backend/pet_ai.py backend/pet_gallery.py backend/pet_entrypoint.py
      - name: Validate web JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ['admin.html', 'pet.html', 'pet_camera.html']:
              html = Path('web', name).read_text()
              scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
              if not scripts:
                  raise SystemExit(f'script not found in {name}')
              Path('/tmp', name + '.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/admin.html.js
          node --check /tmp/pet.html.js
          node --check /tmp/pet_camera.html.js
      - name: Build and smoke-import application
        run: |
          docker build -t camcam-ci .
          docker run --rm camcam-ci python -c "import app, pet_app, pet_archive; assert any(getattr(r, 'path', '') == '/admin' for r in app.app.routes); assert any(getattr(r, 'path', '') == '/api/admin/overview' for r in app.app.routes); assert any(getattr(r, 'path', '') == '/api/pet/devices' for r in pet_app.app.routes); assert any(getattr(r, 'path', '') == '/api/pet/devices/{device_id}/recordings' for r in pet_archive.app.routes); print('CamCam + Pet import smoke test OK')"
          docker run --rm -e DATABASE_URL=sqlite:////tmp/camcam-test.db -e REDIS_URL=redis://127.0.0.1:1/0 camcam-ci python -m unittest discover -s /tests -v
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          rm .env
      - name: Guard brand isolation
        run: |
          LEGACY_LATIN="$(printf '%s%s' 'ha' 'moon')"
          if grep -Rini "$LEGACY_LATIN" --exclude-dir=.git .; then
            echo 'Forbidden legacy brand reference found'
            exit 1
          fi

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy only CamCam application roles on the shared VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 12m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 600 9
            cd /opt/camcam
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            test -s .env
            test -s docker-compose.shared-vps.yml
            mkdir -p ".deployment-backup-$stamp"
            cp -p .env docker-compose.shared-vps.yml Caddyfile.shared-vps ".deployment-backup-$stamp/"
            docker exec camcam-shared-db-1 pg_dump --no-owner --no-privileges -U camcam camcam | gzip -1 > ".deployment-backup-$stamp/postgres.sql.gz"
            previous=$(git rev-parse HEAD)
            previous_image=$(docker inspect -f '{{.Image}}' camcam-shared-api-1)
            git fetch origin main
            changed=$(git diff --name-only "$previous" origin/main -- backend Dockerfile requirements.txt | wc -l)
            git checkout --detach origin/main
            docker compose -p camcam-shared -f docker-compose.yml -f docker-compose.shared-vps.yml config --quiet
            rollback() {
              git checkout --detach "$previous"
              cp -p ".deployment-backup-$stamp/Caddyfile.shared-vps" Caddyfile.shared-vps
              printf 'services:\n  api:\n    image: %s\n  pet:\n    image: %s\n  archive:\n    image: %s\n  petarchive:\n    image: %s\n' "$previous_image" "$previous_image" "$previous_image" "$previous_image" > ".rollback-$stamp.yml"
              docker compose -p camcam-shared -f docker-compose.yml -f docker-compose.shared-vps.yml -f ".rollback-$stamp.yml" up -d --no-deps --no-build api pet archive petarchive
              docker exec camcam-shared-gateway caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
              exit 1
            }
            if [ "$changed" -gt 0 ]; then
              test "$(df -Pk / | awk 'NR==2 {print $4}')" -gt 1500000
              docker compose -p camcam-shared -f docker-compose.yml -f docker-compose.shared-vps.yml build api || rollback
              docker compose -p camcam-shared -f docker-compose.yml -f docker-compose.shared-vps.yml up -d --no-deps --no-build api pet archive petarchive || rollback
            fi
            sed '1s/^camcam.smarbiz.sbs {/:80 {/' Caddyfile > Caddyfile.shared-vps
            docker exec camcam-shared-gateway caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile || rollback
            docker exec camcam-shared-gateway caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || rollback
            ready=0
            for i in $(seq 1 30); do
              if curl -fsS --max-time 4 http://127.0.0.1:8117/health >/dev/null; then ready=1;break;fi
              sleep 2
            done
            [ "$ready" = 1 ] || rollback
            curl -fsS --max-time 15 https://camcam.smarbiz.sbs/health >/dev/null || rollback
            systemctl is-active --quiet rednotedownloader
            nginx -t
            echo CAMCAM_INDEPENDENT_DEPLOYMENT_OK
