name: Build Cafe Bazaar Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'bazaar-v*'

permissions:
  contents: write

concurrency:
  group: camcam-bazaar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Require release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$KEYSTORE_B64" || { echo 'ANDROID_KEYSTORE_BASE64 is missing'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD is missing'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS is missing'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD is missing'; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/camcam-release.jks"
          chmod 600 "$RUNNER_TEMP/camcam-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/camcam-release.jks" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Lint and build signed APK and AAB
        run: |
          gradle -p android :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Stage Bazaar artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/CamCam-Bazaar.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/CamCam-Bazaar.aab
          sha256sum dist/CamCam-Bazaar.apk dist/CamCam-Bazaar.aab | tee dist/SHA256SUMS.txt
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > dist/SIGNING-CERTIFICATE.txt

      - name: Upload Bazaar artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamCam-CafeBazaar-Release
          path: |
            dist/CamCam-Bazaar.apk
            dist/CamCam-Bazaar.aab
            dist/SHA256SUMS.txt
            dist/SIGNING-CERTIFICATE.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release for Bazaar tag
        if: startsWith(github.ref, 'refs/tags/bazaar-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/CamCam-Bazaar.apk \
            dist/CamCam-Bazaar.aab \
            dist/SHA256SUMS.txt \
            dist/SIGNING-CERTIFICATE.txt \
            --title "CamCam ${GITHUB_REF_NAME} - Cafe Bazaar" \
            --notes "Signed production artifacts for Cafe Bazaar. APK is directly uploadable; AAB is included for bundle-based publishing. Preserve the same signing key for every future update."
