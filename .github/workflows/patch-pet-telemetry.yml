name: Patch Pet control telemetry

on:
  push:
    branches: [fix/pet-controls-v2]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pet-telemetry-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pet-controls-v2
          fetch-depth: 0
      - name: Add torch and zoom telemetry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/pet_app.py')
          s=p.read_text(encoding='utf-8')
          needle="    low_power: bool = False\n    codec: str | None = Field(default=None, max_length=40)"
          repl="    low_power: bool = False\n    torch: bool | None = None\n    zoom: float | None = Field(default=None, ge=1, le=8)\n    codec: str | None = Field(default=None, max_length=40)"
          if 'zoom: float | None = Field(default=None, ge=1, le=8)' not in s:
              if needle not in s: raise SystemExit('TelemetryBody anchor not found')
              s=s.replace(needle,repl,1)
              p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile backend/pet_app.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/pet_app.py
          git commit -m "Track camera torch and zoom telemetry [pet-telemetry-patched]"
          git push origin HEAD:fix/pet-controls-v2
