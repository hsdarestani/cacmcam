name: CamCam Archive Retention Recovery
on:
  push:
    branches: [ops/camcam-incident-20261111]
    paths: [.github/workflows/incident-camcam.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Set CamCam MediaMTX retention to 12h and restart its recorder
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1;; esac
            cd /opt/camcam
            test -f mediamtx.yml
            grep -q 'recordDeleteAfter: 31d' mediamtx.yml
            sed -i 's/recordDeleteAfter: 31d/recordDeleteAfter: 12h/' mediamtx.yml
            echo "=== CONFIGURATION ==="
            grep 'recordDeleteAfter:' mediamtx.yml
            docker restart camcam-shared-mediamtx-1
            echo "=== DISK ==="
            df -h /
            echo "=== POSTGRES ==="
            docker exec camcam-shared-db-1 pg_isready -U camcam -d camcam || true
