name: Build CamCam Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camcam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Bazaar signing
        id: signing
        shell: bash
        env:
          BAZAAR_KEYSTORE_B64: ${{ secrets.BAZAAR_KEYSTORE_B64 }}
          BAZAAR_KEYSTORE_PASSWORD: ${{ secrets.BAZAAR_KEYSTORE_PASSWORD }}
          BAZAAR_KEY_ALIAS: ${{ secrets.BAZAAR_KEY_ALIAS }}
          BAZAAR_KEY_PASSWORD: ${{ secrets.BAZAAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${BAZAAR_KEYSTORE_B64:-}" ] && [ -n "${BAZAAR_KEYSTORE_PASSWORD:-}" ] && [ -n "${BAZAAR_KEY_ALIAS:-}" ] && [ -n "${BAZAAR_KEY_PASSWORD:-}" ]; then
            SIGNING_DIR="$RUNNER_TEMP/camcam-signing"
            mkdir -p "$SIGNING_DIR"
            printf '%s' "$BAZAAR_KEYSTORE_B64" | base64 --decode > "$SIGNING_DIR/camcam-bazaar.jks"
            chmod 600 "$SIGNING_DIR/camcam-bazaar.jks"
            echo "BAZAAR_KEYSTORE_PATH=$SIGNING_DIR/camcam-bazaar.jks" >> "$GITHUB_ENV"
            echo "BAZAAR_KEYSTORE_PASSWORD=$BAZAAR_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "BAZAAR_KEY_ALIAS=$BAZAAR_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "BAZAAR_KEY_PASSWORD=$BAZAAR_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug and release APKs
        run: gradle -p android :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Stage APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/CamCam-Test.apk
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/CamCam-Bazaar.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/CamCam-Bazaar-UNSIGNED.apk
          fi
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamCam-Android-APK
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish internal install APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/CamCam-Test.apk dist/SHA256SUMS.txt \
            --title "CamCam Android build ${GITHUB_RUN_NUMBER}" \
            --notes "Internal CamCam test build. The Cafe Bazaar release is published as a separate signed asset only when the repository signing secrets are configured." || \
          gh release upload "$TAG" dist/CamCam-Test.apk dist/SHA256SUMS.txt --clobber

      - name: Publish Bazaar signed APK
        if: github.event_name == 'push' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-build-${GITHUB_RUN_NUMBER}"
          gh release upload "$TAG" dist/CamCam-Bazaar.apk --clobber
