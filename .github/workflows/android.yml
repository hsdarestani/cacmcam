name: Build CamCam Android APKs

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camcam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build camera and viewer APKs
        run: |
          gradle -p android :app:assembleCameraDebug :app:assembleViewerDebug --stacktrace

      - name: Stage APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/camera/debug/app-camera-debug.apk dist/CamCam-Camera.apk
          cp android/app/build/outputs/apk/viewer/debug/app-viewer-debug.apk dist/CamCam-Viewer.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamCam-Android-APKs
          path: |
            dist/CamCam-Camera.apk
            dist/CamCam-Viewer.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/CamCam-Camera.apk dist/CamCam-Viewer.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/CamCam-Camera.apk dist/CamCam-Viewer.apk dist/SHA256SUMS.txt \
              --title "CamCam Android build ${GITHUB_RUN_NUMBER}" \
              --notes "Two installable Android APKs: Camera mode and Viewer mode. These are internal sideload builds signed with the Android debug signing identity."
          fi
