name: Build CamCam Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/bazaar-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/bazaar-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camcam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate debug and release builds
        run: gradle -p android :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Stage internal APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/CamCam.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/CamCam-release-unsigned.apk
          sha256sum dist/CamCam.apk dist/CamCam-release-unsigned.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamCam-Android-APK
          path: |
            dist/CamCam.apk
            dist/CamCam-release-unsigned.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable internal APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/CamCam.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/CamCam.apk dist/SHA256SUMS.txt \
              --title "CamCam Android build ${GITHUB_RUN_NUMBER}" \
              --notes "Internal sideload APK signed with the Android debug identity. For Cafe Bazaar use the dedicated signed Bazaar release workflow."
          fi
